name: CI

# Runs on the repository's self-hosted runner (see .github/RUNNER.md). Never add
# pull_request_target or run jobs from forks: the runner is a desktop with a
# persistent home directory.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pushes finish what they started; GitHub keeps only the newest pending run,
  # so every completed run verifies a whole commit. Pull requests still cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: quick
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: rustfmt
      - name: Install operator Python dependencies
        # Skip the install when PyYAML is already present (externally managed system Pythons reject pip --user).
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user -r self-hosting/requirements-operator.txt
      - name: Run quick verification gates
        run: make verify-quick

  rust:
    name: rust
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy,rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: server-rs
      - name: Check formatting
        working-directory: server-rs
        run: cargo fmt --all -- --check
      - name: Run workspace unit tests
        # No TEST_DATABASE_URL here, so live tests print their skip notice and pass.
        working-directory: server-rs
        run: cargo test --release --locked --workspace
      - name: Run vendored cel tests
        working-directory: server-rs/vendor/cel
        # Release, as the server ships: the deep-nesting parser test overflows
        # the 2 MiB test-thread stack only in unoptimised builds. `json` matches
        # the server's feature set and is the command verify-local.py runs.
        run: cargo test --release --locked --features json
      - name: Enforce the Clippy warning ratchet
        working-directory: server-rs
        run: bash ./clippy-ratchet.sh

  rust-pg:
    name: rust-pg
    needs: rust
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 120
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: server-rs
      - name: Run PostgreSQL acceptance
        # The harness exports REQUIRE_TEST_DATABASE=1 itself and provisions a
        # disposable PostgreSQL through mise. Every live test runs; fix a
        # failing one rather than adding a --skip here.
        run: >-
          bash server-rs/run-postgres-acceptance.sh --locked --no-fail-fast

  client:
    name: client
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install dependencies
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm install --frozen-lockfile
      - name: Build packages
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm build-packages
      - name: Run service-free client tests
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm test:local
      - name: Check formatting
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm check-format
      - name: Type-check the dashboard
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm --filter backendrelay-www check
      - name: Test the dashboard
        working-directory: client
        run: mise exec node@24 pnpm@10.34.9 -- pnpm --filter backendrelay-www test

  sdk-smoke:
    name: sdk-smoke
    needs: [rust, client]
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # The runner container is Ubuntu 24.04; the override is harmless there and
      # keeps an older host usable if Playwright refuses its platform.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Run official SDK smoke suite
        run: bash self-hosting/run-official-sdk-e2e.sh --suite smoke
      - name: Run dashboard runtime smoke test
        run: bash self-hosting/run-dashboard-smoke.sh
      - name: Run cross-app isolation acceptance
        run: bash self-hosting/run-cross-app-isolation-acceptance.sh
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true
