name: Nightly

# Long-running lanes that are too slow for every push. Same self-hosted runner
# as ci.yml (see .github/RUNNER.md).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      oldest-version:
        description: Oldest SDK version reported in production; overrides the repository variable
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  acceptance:
    name: acceptance
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy,rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rs
      - name: Run PostgreSQL acceptance
        # Every live test runs, as in the pull-request rust-pg job.
        run: >-
          bash server-rs/run-postgres-acceptance.sh --locked --no-fail-fast

  sdk-e2e:
    name: sdk-e2e
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 180
    env:
      # The runner container is Ubuntu 24.04; the override is harmless there and
      # keeps an older host usable if Playwright refuses its platform.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Run the full official SDK suite
        run: bash self-hosting/run-official-sdk-e2e.sh --suite full
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true

  sdk-compat:
    name: sdk-compat
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 180
    env:
      # The runner container is Ubuntu 24.04; the override is harmless there and
      # keeps an older host usable if Playwright refuses its platform.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Test the compatibility lane helpers
        run: mise exec node@24 -- node --test self-hosting/sdk-compat/*.test.mjs
      - name: Resolve the SDK version the examples pin
        id: pinned
        run: |
          set -euo pipefail
          scope=$(mise exec node@24 -- node self-hosting/sdk-compat/resolve-pinned-sdk.mjs --print scope)
          version=$(mise exec node@24 -- node self-hosting/sdk-compat/resolve-pinned-sdk.mjs --print version)
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Run the pinned compatibility lane
        # Published tarballs of the exact versions the examples pin; the
        # workspace dist/ is never built in this mode.
        run: >-
          bash self-hosting/run-official-sdk-e2e.sh
          --published-version "${{ steps.pinned.outputs.version }}"
          --scope "${{ steps.pinned.outputs.scope }}"
      - name: Check the oldest reported SDK version is configured
        id: oldest
        env:
          OLDEST_VERSION: ${{ inputs.oldest-version || vars.SDK_COMPAT_OLDEST_VERSION }}
          OLDEST_SCOPE: ${{ vars.SDK_COMPAT_OLDEST_SCOPE }}
        run: |
          set -euo pipefail
          if [ -z "${OLDEST_VERSION:-}" ]; then
            echo '::error::SDK_COMPAT_OLDEST_VERSION is not set. Query backendrelay_sdk_sessions with self-hosting/sdk-compat/oldest-sdk-version.mjs and set the repository variable, or pass oldest-version on dispatch.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$OLDEST_VERSION" >> "$GITHUB_OUTPUT"
          printf 'scope=%s\n' "${OLDEST_SCOPE:-${{ steps.pinned.outputs.scope }}}" >> "$GITHUB_OUTPUT"
      - name: Run the oldest reported compatibility lane
        if: >-
          steps.oldest.outputs.version != steps.pinned.outputs.version ||
          steps.oldest.outputs.scope != steps.pinned.outputs.scope
        run: >-
          bash self-hosting/run-official-sdk-e2e.sh
          --published-version "${{ steps.oldest.outputs.version }}"
          --scope "${{ steps.oldest.outputs.scope }}"
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true

  dashboard-browser:
    name: dashboard-browser
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 120
    # The suite now runs the new dashboard's live journey. Keep it non-blocking
    # until it has completed cleanly on the self-hosted runner a few times.
    continue-on-error: true
    env:
      # The runner container is Ubuntu 24.04; the override is harmless there and
      # keeps an older host usable if Playwright refuses its platform.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Run the dashboard live journey
        run: make verify-dashboard-browser
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true

  restart-acceptance:
    name: restart-acceptance
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Run single-server restart acceptance
        run: bash self-hosting/run-single-server-restart-acceptance.sh
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true

  upgrade-rollback:
    name: upgrade-rollback
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 45
    continue-on-error: false
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The lane builds the previous server image from HEAD~1.
          fetch-depth: 2
          clean: true
          persist-credentials: false
      - name: Run upgrade and rollback acceptance
        run: bash self-hosting/run-upgrade-rollback-test.sh --from-ref HEAD~1
      - name: Prune Docker leftovers
        if: always()
        run: docker system prune -f --filter until=24h || true

  audit:
    name: audit
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - name: Audit Rust and client dependencies
        # cargo deny (server-rs/deny.toml: advisories, licences, sources) and
        # pnpm audit --prod, with the documented, dated suppressions.
        run: mise exec node@24 pnpm@10.34.9 -- make audit

  upstream-watch:
    name: upstream-watch
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 15
    steps:
      - name: Record published @instantdb/core dist-tags
        continue-on-error: true
        run: |
          {
            echo '### @instantdb/core dist-tags'
            echo '```json'
            mise exec node@24 -- npm view @instantdb/core dist-tags --json || echo '"lookup failed"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
