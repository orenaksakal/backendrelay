name: Release images

# A v* tag publishes the multi-architecture server and dashboard images to
# GHCR, signs the manifest digests with the repository cosign key, and verifies
# the signatures, platforms, SBOM and provenance before recording the digests.
# .github/RUNNER.md documents the runner, binfmt and secret setup.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: [self-hosted, linux, x64, backendrelay]
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Check the release signing inputs
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s self-hosting/cosign.pub || {
            echo 'commit the cosign public key at self-hosting/cosign.pub' >&2
            exit 1
          }
          test -n "$COSIGN_PRIVATE_KEY" || {
            echo 'COSIGN_PRIVATE_KEY repository secret is not set' >&2
            exit 1
          }
          test -n "$COSIGN_PASSWORD" || {
            echo 'COSIGN_PASSWORD repository secret is not set' >&2
            exit 1
          }
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push both architectures
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          fi
          bash self-hosting/release-images.sh --push --tag "$tag" --digests-out release-digests.json
      - name: Sign the image index digests
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # A key pair keeps the private repository's workflow identity out of
          # the public Rekor log. Switch to keyless signing with
          # --tlog-upload=true once the repository is public.
          mapfile -t refs < <(jq -r '.images[].ref' release-digests.json)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo 'release-digests.json contains no images' >&2
            exit 1
          fi
          for ref in "${refs[@]}"; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$ref"
          done
      - name: Verify signatures, platforms and attestations
        run: |
          set -euo pipefail
          mapfile -t refs < <(jq -r '.images[].ref' release-digests.json)
          COSIGN_PUBLIC_KEY=self-hosting/cosign.pub self-hosting/verify-release-images.sh "${refs[@]}"
      - name: Record the digests
        run: |
          set -euo pipefail
          {
            echo '## Signed release images'
            echo
            jq -r '.images[] | "- `\(.ref)`"' release-digests.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the digest record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digests-${{ github.sha }}
          path: release-digests.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove the registry credentials
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
