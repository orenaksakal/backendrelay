# Weekly dependency updates. Each ecosystem opens at most one grouped PR,
# except that semver ecosystems isolate majors in their own PR. CI must pass
# before anything is merged; merges stay manual (see docs/operations.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server-rs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      major:
        patterns:
          - "*"
        update-types:
          - major
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Patched to the vendored copy in server-rs/vendor/cel.
      - dependency-name: cel

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      major:
        patterns:
          - "*"
        update-types:
          - major
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      major:
        patterns:
          - "*"
        update-types:
          - major
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server-rs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /client/dashboard/deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /self-hosting/postgres
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /self-hosting/ci-runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /self-hosting/canary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /self-hosting
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
